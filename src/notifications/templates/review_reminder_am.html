<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: 'Noto Sans Ethiopic', sans-serif; padding: 20px; max-width: 600px; margin: 0 auto;">
  <h2 style="color: #2563eb;">የመከለሻ ማሳሰቢያ</h2>
  <p>ለመከለስ የሚጠብቁዎት ርዕሶች አሉ፦</p>
  <ul>
    {% for topic in topics %}
    <li><strong>{{ topic.name }}</strong> — ለመጨረሻ ጊዜ የተከለሰው {{ topic.last_reviewed }}</li>
    {% endfor %}
  </ul>
  <p>መደበኛ መከለስ የተማሩትን እንዳይረሱ ይረዳል!</p>
  <p style="color: #6b7280; font-size: 12px; margin-top: 24px;">EthioSci AI Assistant</p>
</body>
</html>
