name: opencode-fix
on:
  issue_comment:
    types: [created]
jobs:
  auto-fix:
    if: |
      github.event.issue.pull_request &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, '/opencode auto-fix') ||
       contains(github.event.comment.body, '/oc auto-fix'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout PR head (code to fix)
        run: |
          gh pr checkout ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin pr-auto-loop scripts to base branch (security)
        run: |
          git fetch origin ${{ github.event.issue.pull_request.base.ref }}
          git checkout origin/${{ github.event.issue.pull_request.base.ref }} -- scripts/pr-auto-loop/

      - name: Run pr-auto-loop auto-fix
        run: |
          bash scripts/pr-auto-loop/pr-review-loop.sh auto -n 5
