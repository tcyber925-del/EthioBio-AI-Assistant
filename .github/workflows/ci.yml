name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv pip install --system -r requirements.txt
      - run: uv pip install --system -r requirements-bot.txt
      - run: uv pip install --system ruff mypy pytest-timeout
      - name: Ruff check
        run: ruff check src/
      - name: Mypy
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv pip install --system -r requirements.txt
      - run: uv pip install --system -r requirements-bot.txt
      - run: uv pip install --system coverage pytest-timeout pytest-cov chromadb spacy
      - name: Run tests (unit + integration, exclude slow)
        run: pytest tests/ -v --no-header --timeout=120 --cov=src --cov-report=term-missing -m "not slow" --tb=short
      - name: Run smoke tests
        run: pytest tests/ -v -m smoke --tb=short

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv pip install --system -r requirements.txt
      - run: uv pip install --system pip-audit bandit
      - name: pip-audit
        run: pip-audit --ignore-vuln PYSEC-2023-123 --ignore-vuln PYSEC-2024-456
        continue-on-error: true
      - name: bandit
        run: bandit -r src/ -c pyproject.toml
        continue-on-error: true

  dashboard-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: i18n consistency check
        working-directory: dashboard
        run: node scripts/check-i18n.mjs --strict

  dashboard-build:
    runs-on: ubuntu-latest
    needs: dashboard-i18n
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci
      - name: Type check
        working-directory: dashboard
        run: npx tsc --noEmit
      - name: Run tests
        working-directory: dashboard
        run: npm test
      - name: Build
        working-directory: dashboard
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.bot
          failure-threshold: error
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.dashboard
          failure-threshold: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [test, security, dashboard-build, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy API to Railway
        run: railway up --service ethiobio-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Deploy dashboard to Vercel
        working-directory: dashboard
        run: npx vercel deploy --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
