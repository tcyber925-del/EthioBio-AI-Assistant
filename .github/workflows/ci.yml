name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv pip install --system -r requirements.txt
      - run: uv pip install --system -r requirements-bot.txt
      - run: uv pip install --system ruff mypy
      - name: Ruff check
        run: ruff check src/
      - name: Mypy
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv pip install --system -r requirements.txt
      - run: uv pip install --system -r requirements-bot.txt
      - name: Run tests (excl. heavy integration)
        run: pytest tests/ -v --no-header -k "not test_chat_endpoint and not test_quiz_generate_endpoint" -x
