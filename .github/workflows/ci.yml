name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv pip install --system -r requirements.txt
      - run: uv pip install --system -r requirements-bot.txt
      - run: uv pip install --system ruff mypy pytest-timeout
      - name: Ruff check
        run: ruff check src/
      - name: Mypy
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv pip install --system -r requirements.txt
      - run: uv pip install --system -r requirements-bot.txt
      - run: uv pip install --system pytest-timeout
      - name: Run tests (excl. heavy integration)
        run: pytest tests/ -v --no-header --timeout=120 --ignore=tests/test_admin_api.py --ignore=tests/test_admin_review.py --ignore=tests/test_api.py --ignore=tests/test_api_notifications.py --ignore=tests/test_auth.py --ignore=tests/test_export.py --ignore=tests/test_knowledge_platform.py --ignore=tests/test_recovery.py --ignore=tests/test_style_transfer.py --ignore=tests/test_svg_validator.py --ignore=tests/test_telegram_bot.py --ignore=tests/test_tracing_api.py --ignore=tests/test_warnings.py --ignore=tests/test_diagram_storage.py --ignore=tests/test_diagram_tutor_integration.py --ignore=tests/test_digital_twin.py --ignore=tests/test_digital_twin_consumer.py --ignore=tests/test_ekg.py --ignore=tests/test_event_infrastructure.py --ignore=tests/test_event_logger.py --ignore=tests/test_icon_library.py --ignore=tests/test_intervention_service.py --ignore=tests/test_memory.py --ignore=tests/test_continue_learning_readiness.py --ignore=tests/test_guardrails -k "not test_graph_chat_response_schema_has_xp_fields" --tb=short
