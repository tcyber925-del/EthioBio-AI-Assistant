name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv pip install --system -r requirements.txt
      - run: uv pip install --system -r requirements-bot.txt
      - run: uv pip install --system ruff mypy pytest-timeout
      - name: Ruff check
        run: ruff check src/
      - name: Mypy
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv pip install --system -r requirements.txt
      - run: uv pip install --system -r requirements-bot.txt
      - run: uv pip install --system coverage pytest-timeout pytest-cov
      - name: Run tests (unit + integration, exclude slow)
        run: pytest tests/ -v --no-header --timeout=120 --cov=src --cov-report=term-missing -m "not slow" --tb=short
      - name: Run smoke tests
        run: pytest tests/ -v -m smoke --tb=short

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv pip install --system -r requirements.txt
      - run: uv pip install --system pip-audit bandit
      - name: pip-audit
        run: pip-audit --ignore-vuln PYSEC-2023-123 --ignore-vuln PYSEC-2024-456
        continue-on-error: true
      - name: bandit
        run: bandit -r src/ -c pyproject.toml
        continue-on-error: true
