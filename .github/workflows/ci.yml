name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ethiobio
          POSTGRES_PASSWORD: ethiobio_pass
          POSTGRES_DB: ethiobio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U ethiobio
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend deps
        run: pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Typecheck with mypy
        run: mypy src/
        continue-on-error: true

      - name: Test with pytest
        run: pytest tests/ -v -k "not test_chat_endpoint and not test_quiz_generate_endpoint" --timeout=60
        env:
          DATABASE_URL: postgresql+asyncpg://ethiobio:ethiobio_pass@localhost:5432/ethiobio
          REDIS_URL: redis://localhost:6379/0

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start server
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 30000

      - name: Run Playwright tests
        run: npx playwright test --reporter=list
        env:
          BASE_URL: http://localhost:3000
