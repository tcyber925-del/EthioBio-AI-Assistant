name: Diagnostic Render PG connectivity

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql --version
      - name: psql external TLS
        id: tls
        env:
          RENDER_PG: ${{ secrets.RENDER_PG_DIAG }}
        run: |
          set +e
          out=$(psql "$RENDER_PG?sslmode=require&connect_timeout=25" -c "SELECT 1;" 2>&1)
          rc=$?
          echo "rc=$rc"
          echo "$out"
          exit 0
      - name: plaintext probe
        env:
          RENDER_PG: ${{ secrets.RENDER_PG_DIAG }}
        run: |
          set +e
          out=$(psql "$RENDER_PG?sslmode=disable&connect_timeout=25" -c "SELECT 1;" 2>&1)
          rc=$?
          echo "rc=$rc"
          echo "$out"
          exit 0
      - name: verify-full probe
        env:
          RENDER_PG: ${{ secrets.RENDER_PG_DIAG }}
        run: |
          set +e
          out=$(psql "$RENDER_PG?sslmode=verify-full&connect_timeout=25" -c "SELECT 1;" 2>&1)
          rc=$?
          echo "rc=$rc"
          echo "$out"
          exit 0
      - name: list tables
        env:
          RENDER_PG: ${{ secrets.RENDER_PG_DIAG }}
        run: |
          set +e
          out=$(psql "$RENDER_PG?sslmode=require&connect_timeout=25" -c "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename LIMIT 10;" 2>&1)
          rc=$?
          echo "rc=$rc"
          echo "$out"
          exit 0
