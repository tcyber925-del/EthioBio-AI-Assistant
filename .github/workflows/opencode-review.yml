name: opencode-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@<full-commit-sha>  # v6.x.x
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@<full-commit-sha>
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash-free
          prompt: |
            Review this pull request for code quality, bugs, and best practices.
            For each issue found, provide a ```diff suggestion block that can be
            automatically applied. Follow the exact diff format:
            ```diff
            - old line
            + new line
            ```
            Focus on issues that have clear, unambiguous fixes.
