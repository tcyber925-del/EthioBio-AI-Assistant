name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip install b2 -q

      - name: Dump database to B2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_SYNC_URL }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -eo pipefail
          b2 authorize-account "$B2_KEY_ID" "$B2_APP_KEY"
          TS=$(date -u +%F)
          # Server is PostgreSQL 18; apt postgresql-client on ubuntu-latest is 16
          # and refuses to dump newer servers. Use the matching docker image.
          dump() {
            docker run --rm postgres:18-alpine pg_dump "$DATABASE_URL" --clean --if-exists --no-owner
          }
          echo "Dumping database..."
          dump > "/tmp/ethiobio_prod_$TS.sql"
          gzip -c "/tmp/ethiobio_prod_$TS.sql" | b2 upload-file "$B2_BUCKET" - "ethiobio_prod_$TS.sql.gz"
          echo "Uploading latest alias..."
          gzip -c "/tmp/ethiobio_prod_$TS.sql" | b2 upload-file "$B2_BUCKET" - ethiobio_prod_latest.sql.gz
          rm -f "/tmp/ethiobio_prod_$TS.sql"
          echo "Backup complete: ethiobio_prod_$TS.sql.gz"
