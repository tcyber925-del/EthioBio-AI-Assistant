name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip install b2 -q

      - name: Dump database to B2
        env:
          API_BASE: https://ethiobio-api.onrender.com
          BACKUP_ADMIN_EMAIL: ${{ secrets.BACKUP_ADMIN_EMAIL }}
          BACKUP_ADMIN_PASSWORD: ${{ secrets.BACKUP_ADMIN_PASSWORD }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -eo pipefail
          b2 authorize-account "$B2_KEY_ID" "$B2_APP_KEY"
          TS=$(date -u +%F)
          # Render blocks external DB access for this instance; dump through the
          # app's internal connection (GET /admin/db-backup streams pg_dump).
          TOKEN=$(curl -fsS -X POST "$API_BASE/auth/token" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$BACKUP_ADMIN_EMAIL\",\"password\":\"$BACKUP_ADMIN_PASSWORD\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          echo "Dumping database..."
          curl -fsS -H "Authorization: Bearer $TOKEN" "$API_BASE/admin/db-backup" \
            | gzip -c > "/tmp/ethiobio_prod_$TS.sql.gz"
          test -s "/tmp/ethiobio_prod_$TS.sql.gz"
          gzip -t "/tmp/ethiobio_prod_$TS.sql.gz"
          test "$(stat -c%s "/tmp/ethiobio_prod_$TS.sql.gz")" -gt 1048576 \
            || { echo "ERROR: backup too small (likely empty dump)"; exit 1; }
          zgrep -q "CREATE TABLE public.users" "/tmp/ethiobio_prod_$TS.sql.gz" \
            || { echo "ERROR: dump missing expected tables"; exit 1; }
          echo "backup bytes: $(stat -c%s "/tmp/ethiobio_prod_$TS.sql.gz")"
          echo "Uploading backup..."
          b2 upload-file "$B2_BUCKET" "/tmp/ethiobio_prod_$TS.sql.gz" "ethiobio_prod_$TS.sql.gz"
          echo "Uploading latest alias..."
          b2 upload-file "$B2_BUCKET" "/tmp/ethiobio_prod_$TS.sql.gz" "ethiobio_prod_latest.sql.gz"
          rm -f "/tmp/ethiobio_prod_$TS.sql.gz"
          echo "Backup complete: ethiobio_prod_$TS.sql.gz"

      - name: Upload failed dump for inspection
        if: failure()
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          b2 authorize-account "$B2_KEY_ID" "$B2_APP_KEY"
          TS=$(date -u +%F)
          if [ -s "/tmp/ethiobio_prod_$TS.sql.gz" ]; then
            b2 upload-file "$B2_BUCKET" "/tmp/ethiobio_prod_$TS.sql.gz" "ethiobio_prod_${TS}_FAILED.sql.gz" || true
            echo "Uploaded failed dump for inspection: ethiobio_prod_${TS}_FAILED.sql.gz"
          fi
