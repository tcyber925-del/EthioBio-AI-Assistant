name: Test Runner

on:
  workflow_dispatch:
  issues:
    types: [labeled]

jobs:
  test:
    if: github.event.label.name == 'ai-ready'
    runs-on: self-hosted
    steps:
      - name: Test
        run: |
          echo "Test workflow triggered"
          echo "Event: ${{ github.event_name }}"
          echo "Label: ${{ github.event.label.name }}"
          echo "Issue: ${{ github.event.issue.number }}"
          echo "Repo: ${{ github.repository }}"
