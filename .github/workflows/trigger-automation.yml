name: Trigger AI Automation

on:
  issues:
    types: [labeled]

jobs:
  trigger-automation:
    if: github.event.label.name == 'ai-ready'
    runs-on: self-hosted
    steps:
      - name: Trigger Hermes Automation
        run: |
          echo "Issue ${{ github.event.issue.number }} labeled ai-ready in ${{ github.repository }}"
          echo "Self-hosted runner will execute the automation"
          
      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **Automation Triggered**\n\nIssue labeled `ai-ready`. The AI engineering automation will process this issue via the self-hosted runner.\n\n**Runner:** `self-hosted` on `tcyber-hp-probook-1`\n**Status:** Queued for execution'
            })
