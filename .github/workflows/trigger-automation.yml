name: Trigger AI Automation

on:
  issues:
    types: [labeled]

jobs:
  trigger-automation:
    runs-on: self-hosted
    permissions:
      issues: write
      contents: read
    steps:
      - name: Debug Event
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Label: ${{ github.event.label.name }}"
          echo "Action: ${{ github.event.action }}"
          echo "Issue: ${{ github.event.issue.number }}"
          echo "Repo: ${{ github.repository }}"
          
      - name: Comment on Issue
        run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "🤖 **Automation Triggered** Issue labeled \`ai-ready\`. The AI engineering automation will process this issue via the self-hosted runner. **Runner:** \`self-hosted\` on \`tcyber-hp-probook-1\` **Status:** Queued for execution"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}