name: Agent Evaluation

# Runs LangSmith offline evaluation experiments against the ethiobio datasets.
#
# On GitHub-hosted runners the full pipeline cannot reach the Render Postgres
# (IP allowlist blocks external DB access), so scheduled runs trigger the eval
# through the app's admin endpoint (/admin/langsmith-eval), which runs
# in-process where the DB and LLM providers are reachable. PR-labeled runs
# stay as a smoke subset that validates wiring only.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # Monday 02:00 UTC
  pull_request:
    branches: [main]
    types: [labeled]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Sync LangSmith datasets
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING_ENABLED: "true"
          LANGSMITH_SAMPLING_RATE: "1.0"
        run: python -m src.evaluation.langsmith.sync_datasets
      - name: Run full evaluation via app admin endpoint
        env:
          API_BASE: https://ethiobio-api.onrender.com
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          DATASET: ethiobio-curriculum
        run: |
          RESP=$(curl -fsS -X POST "$API_BASE/admin/langsmith-eval" \
            -H "X-API-Key: $INTERNAL_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"dataset\":\"$DATASET\"}")
          echo "$RESP"
          echo "$RESP" | python3 -c '
          import json,sys
          r=json.load(sys.stdin)
          print("scores:", json.dumps(r["scores"], indent=2))
          if not r.get("ok"):
              sys.exit(1)
          '
      - name: Run evaluation (smoke subset, PRs only)
        if: github.event_name == 'pull_request'
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING_ENABLED: "true"
          LANGSMITH_SAMPLING_RATE: "1.0"
        run: python -m src.evaluation.langsmith.run --dataset ethiobio-curriculum --limit 1 --threshold 0.0 || true