databases:
  - name: ethiobio-pg
    databaseName: ethiobio
    user: ethiobio
    plan: free
    postgresMajorVersion: 16

redis:
  - name: ethiobio-kv
    plan: free

services:
  - type: web
    name: ethiobio-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /liveness
    envVarGroups:
      - ethiobio-app

  - type: cron
    name: ethiobio-reminders
    runtime: docker
    schedule: "0 2 * * *"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVarGroups:
      - ethiobio-app
    startCommand: python -m scripts.send_proactive_reminders

  - type: cron
    name: ethiobio-digests
    runtime: docker
    schedule: "30 2 * * *"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVarGroups:
      - ethiobio-app
    startCommand: python -m scripts.send_digests

envVarGroups:
  - name: ethiobio-app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ethiobio-pg
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: ethiobio-kv
          property: connectionString
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        value: https://ethiobio-api.onrender.com/webhook
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: ENABLE_RERANKER
        value: "false"
      - key: STORE_BACKEND
        value: pgvector
      - key: COLLECTION_NAME
        value: ethiobio_curriculum
      - key: VECTOR_STORE_PATH
        value: /app/data/vectors_new
      - key: DASHBOARD_URL
        value: https://ethio-bio-ai-assistant.vercel.app
      - key: API_BASE_URL
        value: https://ethiobio-api.onrender.com
      - key: SENTRY_DSN
        sync: false
