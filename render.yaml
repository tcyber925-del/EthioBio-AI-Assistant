databases:
  - name: ethiobio-pg
    databaseName: ethiobio
    user: ethiobio
    plan: free
    postgresMajorVersion: '18'
    region: frankfurt

services:
  - type: keyvalue
    name: ethiobio-kv
    plan: free
    region: frankfurt
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

  - type: web
    name: ethiobio-api
    runtime: image
    plan: free
    region: frankfurt
    image:
      url: ghcr.io/tcyber925-del/ethiobio-ai-assistant:latest
    healthCheckPath: /liveness
    envVars:
      - fromGroup: ethiobio-app
      - key: DATABASE_URL
        fromDatabase:
          name: ethiobio-pg
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ethiobio-kv
          type: keyvalue
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: DASHBOARD_URL
        value: https://ethio-bio-ai-assistant.vercel.app
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: ADDIS_API_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: cron
    name: ethiobio-langsmith-eval
    runtime: image
    plan: free
    region: frankfurt
    schedule: "30 2 * * 1" # Monday 02:30 UTC — full LangSmith evaluation
    image:
      url: ghcr.io/tcyber925-del/ethiobio-ai-assistant:latest
    envVars:
      - fromGroup: ethiobio-app
      - key: DATABASE_URL
        fromDatabase:
          name: ethiobio-pg
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ethiobio-kv
          type: keyvalue
          property: connectionString
      - key: LANGSMITH_SAMPLING_RATE
        value: "1.0" # trace every eval run
    startCommand: python -m src.evaluation.langsmith.run --dataset ethiobio-curriculum

envVarGroups:
  - name: ethiobio-app
    envVars:
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: TELEGRAM_WEBHOOK_URL
        value: https://ethiobio-api.onrender.com/webhook
      - key: ENABLE_RERANKER
        value: "false" # sentence_transformers not in image (512Mi free-tier limit)
      - key: EVAL_JUDGE_MODEL
        value: ollama/gpt-oss:20b # OpenRouter has no credits; judge runs on Ollama cloud
      - key: JINA_API_KEY
        sync: false
      - key: ADDIS_BASE_URL
        value: https://api.addisassistant.com
      - key: ADDIS_TTS_VOICE_AM
        value: am-hamen
      - key: ADDIS_TTS_OUTPUT_FORMAT
        value: mp3_44100
      - key: STORE_BACKEND
        value: pgvector
      - key: COLLECTION_NAME
        value: ethiobio_curriculum
      - key: VECTOR_STORE_PATH
        value: /app/data/vectors_new
      - key: DASHBOARD_URL
        value: https://ethio-bio-ai-assistant.vercel.app
      - key: API_BASE_URL
        value: https://ethiobio-api.onrender.com
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com
      - key: LANGSMITH_PROJECT
        value: ethiobio
      - key: LANGSMITH_TRACING_ENABLED
        value: "true"
      - key: LANGSMITH_SAMPLING_RATE
        value: "0.1"