[project]
name = "ethiobio-ai-assistant"
version = "1.1.0"
description = "AI-powered biology learning assistant for Ethiopian middle and high school education"
requires-python = ">=3.12"
dependencies = ["httpx", "structlog>=24.4.0"]

[project.scripts]
ethiobio = "src.main:run"
ethiobio-bot = "src.telegram.bot:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "smoke: quick smoke-test scenarios",
    "integration: integration and journey tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"src/agents/*" = ["E501"]
"src/evaluation/*" = ["E501"]
"src/graph/*" = ["E501"]
"tests/*" = ["E501", "N803", "N806"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
