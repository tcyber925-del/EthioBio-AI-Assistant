services:
  app:
    build: .
    container_name: ethiobio-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ethiobio:ethiobio_pass@postgres:5432/ethiobio
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  telegram-bot:
    build: .
    container_name: ethiobio-bot
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ethiobio:ethiobio_pass@postgres:5432/ethiobio
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./data:/app/data
    command: python -m src.telegram.bot

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ethiobio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ethiobio
      POSTGRES_PASSWORD: ethiobio_pass
      POSTGRES_DB: ethiobio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethiobio"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ethiobio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ethiobio-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s

  cron:
    build: .
    container_name: ethiobio-cron
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ethiobio:ethiobio_pass@postgres:5432/ethiobio
      REDIS_URL: redis://redis:6379/0
    command: sh -c "while true; do echo 'Running proactive reminders...'; python -m scripts.send_proactive_reminders; echo 'Sleeping 24h...'; sleep 86400; done"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: ../Dockerfile.dashboard
      args:
        NEXT_PUBLIC_API_URL: http://app:8000
    container_name: ethiobio-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - app
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://app:8000

volumes:
  postgres_data:
  redis_data:
  ollama_data:
