services:
  app:
    build: .
    container_name: ethiosci-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_healthy
      jaeger:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${PG_USER:-ethiosci}:${PG_PASSWORD}@postgres:5432/${PG_DB:-ethiosci}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OTEL_ENDPOINT: http://jaeger:4317
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  telegram-bot:
    build:
      dockerfile: Dockerfile.bot
    container_name: ethiosci-bot
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      jaeger:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${PG_USER:-ethiosci}:${PG_PASSWORD}@postgres:5432/${PG_DB:-ethiosci}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OTEL_ENDPOINT: http://jaeger:4317
    volumes:
      - ./data:/app/data
    command: python -m src.telegram.bot

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ethiosci-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-ethiosci}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB:-ethiosci}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethiosci"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ethiosci-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.5.12}
    container_name: ethiosci-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s

  cron:
    build: .
    container_name: ethiosci-cron
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${PG_USER:-ethiosci}:${PG_PASSWORD}@postgres:5432/${PG_DB:-ethiosci}
      REDIS_URL: redis://redis:6379/0
    command: sh -c "while true; do echo 'Running proactive reminders...'; python -m scripts.send_proactive_reminders; echo 'Sleeping 24h...'; sleep 86400; done"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ethiosci-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: true

  prometheus:
    image: prom/prometheus:latest
    container_name: ethiosci-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      app:
        condition: service_healthy
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"

  grafana:
    image: grafana/grafana:latest
    container_name: ethiosci-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}

  dashboard:
    build:
      context: ./dashboard
      dockerfile: ../Dockerfile.dashboard
      args:
        NEXT_PUBLIC_API_URL: http://app:8000
    container_name: ethiosci-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - app
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://app:8000

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data:
